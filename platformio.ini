[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8

; Network + broker config. Override locally without committing secrets
; by creating a `secrets.ini` next to this file (gitignored) with:
;
;   [env:esp32dev]
;   build_flags =
;       -DWIFI_SSID=\"my-ssid\"
;       -DWIFI_PSK=\"my-psk\"
;
; and uncommenting the `extra_configs` line below.
;
; extra_configs = secrets.ini
build_flags =
    -DWIFI_SSID=\"reokto-net\"
    -DWIFI_PSK=\"reokto-pass-change-me\"
    -DMQTT_HOST=\"10.42.0.1\"
    -DMQTT_PORT=1883
    -DMQTT_CLIENT_ID=\"reokto-esp32\"
