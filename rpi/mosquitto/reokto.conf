# Mosquitto drop-in config for the reokto-demo dashboard.
# Installed to /etc/mosquitto/conf.d/reokto.conf by rpi/setup.sh.
#
# The Pi only ever serves clients on its own AP subnet (10.42.0.0/24),
# so anonymous access is acceptable for this demo. Tighten with a
# password file (see `mosquitto_passwd`) before exposing to anything
# else.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /var/lib/mosquitto/

log_dest syslog
log_type error
log_type warning
log_type notice
