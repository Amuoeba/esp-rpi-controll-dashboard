# Mosquitto drop-in config for the reokto-demo dashboard.
# Installed to /etc/mosquitto/conf.d/reokto.conf by rpi/setup.sh.
#
# Only contains the delta vs. Debian's stock /etc/mosquitto/mosquitto.conf
# (which already sets persistence, persistence_location, log_dest file, and
# include_dir conf.d). Adding those again here either duplicates them or,
# in the case of log_dest, makes mosquitto log to both targets.
#
# The Pi only ever serves clients on its own AP subnet (10.42.0.0/24),
# so anonymous access is acceptable for this demo. Tighten with a
# password file (see `mosquitto_passwd`) before exposing to anything
# else.

listener 1883 0.0.0.0
allow_anonymous true
